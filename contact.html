<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | HOMAM AJEENA</title>
    <!-- خطوط وأيقونات جوجل وFontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gold: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 450px;
            width: 88%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        .sub-heading {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        /* نموذج إرسال الرسائل */
        .form-group {
            margin-bottom: 1.2rem;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #f59e0b;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-gold);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.2);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .divider {
            height: 1px;
            background: var(--card-border);
            margin: 2rem 0 1.5rem 0;
        }

        /* خانة المنصات الاجتماعية */
        .social-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .social-grid {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .social-card:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
            color: #f59e0b;
            transform: translateY(-3px);
        }

        .back-btn {
            display: inline-block;
            margin-top: 1.8rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>إرسال رسالة</h2>
        <p class="sub-heading">يمكنك ترك رسالتك هنا وستصلني مباشرة</p>

        <!-- نموذج المراسلة المباشر -->
        <form action="https://formspree.io/f/sample" method="POST">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" name="name" required placeholder="ادخل اسمك هنا">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" name="email" required placeholder="example@domain.com">
            </div>
            <div class="form-group">
                <label>الرسالة</label>
                <textarea name="message" required placeholder="اكتب رسالتك هنا..."></textarea>
            </div>
            <button type="submit" class="btn-submit">إرسال الرسالة</button>
        </form>

        <div class="divider"></div>

        <!-- خانة منصات التواصل الاجتماعي -->
        <p class="social-title">أو تواصل معي عبر المنصات التالية:</p>
        <div class="social-grid">
            <a href="https://x.com/HOMAM_AJEENA" target="_blank" class="social-card" title="X"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://instagram.com/HOMAM_AJEENA" target="_blank" class="social-card" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://linkedin.com/in/HOMAM_AJEENA" target="_blank" class="social-card" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>

        <a href="index.html" class="back-btn">← العودة للصفحة الرئيسية</a>
    </div>
</body>
</html>
