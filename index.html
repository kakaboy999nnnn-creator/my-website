<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMAM AJEENA</title>
    <!-- خطوط جوجل الفاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gold: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --accent-glow: rgba(245, 158, 11, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* توهج خلفي جمالي */
        .glow-orb {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.18) 0%, rgba(0,0,0,0) 70%);
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3.5rem 2.2rem;
            max-width: 420px;
            width: 88%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 1.8rem;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(245, 158, 11, 0.5);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.6rem;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .btn-contact {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background: var(--accent-gold);
            padding: 14px 38px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(217, 119, 6, 0.4);
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    
    <div class="card">
        <div class="avatar-wrapper">
            <img src="IMG_20241120_004252_065.jpg" alt="HOMAM AJEENA" class="avatar-img">
        </div>
        
        <h1>HOMAM AJEENA</h1>
        <p class="subtitle">مرحباً بكم.. هذه المساحة الرسمية الخاصة بي للتواصل المباشر.</p>
        
        <a href="contact.html" class="btn-contact">Contact Me</a>
    </div>
</body>
</html>
