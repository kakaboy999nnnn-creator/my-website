<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="الصفحة الرسمية للتواصل مع همام عجينة">
<title>HOMAM AJEENA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:      #05070a;
    --wood-1:   #0c0f0c;
    --wood-2:   #1a140f;
    --gold-1:   #ecd08a;
    --gold-2:   #b98a34;
    --gold-3:   #6e4c1e;
    --ivory:    #f4ecdc;
    --muted:    #a79a86;
    --hair:     rgba(236,208,138,0.20);
    --glow:     rgba(185,138,52,0.22);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:'Tajawal', sans-serif;
    color:var(--ivory);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    background:
      radial-gradient(ellipse 60% 50% at 50% 8%, var(--glow), transparent 60%),
      linear-gradient(160deg, var(--wood-1) 0%, #100c09 45%, var(--wood-2) 100%);
    padding:24px;
  }

  @media (prefers-reduced-motion:no-preference){
    body{ animation:bg-breathe 14s ease-in-out infinite alternate; }
  }
  @keyframes bg-breathe{
    from{ filter:brightness(1); }
    to{ filter:brightness(1.06); }
  }

  /* drifting gold dust — cheap, ambient, single orchestrated effect */
  .dust{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .dust i{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--gold-1);
    opacity:0;
    box-shadow:0 0 6px 1px var(--glow);
  }
  @media (prefers-reduced-motion:no-preference){
    .dust i{ animation:rise linear infinite; }
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.65; }
    90%{ opacity:.35; }
    100%{ transform:translateY(-120vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* ---- card ---- */
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
  }

  .frame-corner{
    position:absolute;
    width:34px; height:34px;
    border:1.5px solid var(--gold-2);
    opacity:.7;
  }
  .frame-corner.tl{ top:-1px; right:-1px; border-left:none; border-bottom:none; border-top-right-radius:18px; }
  .frame-corner.br{ bottom:-1px; left:-1px; border-right:none; border-top:none; border-bottom-left-radius:18px; }

  .card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--hair);
    border-radius:22px;
    padding:3.6rem 2.1rem 2.8rem;
    text-align:center;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  @media (prefers-reduced-motion:no-preference){
    .card{ animation:rise-in 1s cubic-bezier(.19,1,.22,1) both; }
  }
  @keyframes rise-in{
    from{ opacity:0; transform:translateY(18px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---- ornamental ring + avatar ---- */
  .ring-wrap{
    position:relative;
    width:148px; height:148px;
    margin:0 auto 1.6rem;
  }

  .ring-wrap svg{
    position:absolute; inset:0;
    width:100%; height:100%;
  }

  @media (prefers-reduced-motion:no-preference){
    .ring-rotate{ animation:spin 40s linear infinite; transform-origin:50% 50%; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .avatar-img{
    position:absolute;
    top:16px; left:16px; right:16px; bottom:16px;
    width:calc(100% - 32px);
    height:calc(100% - 32px);
    border-radius:50%;
    object-fit:cover;
    border:1px solid rgba(236,208,138,0.35);
  }

  h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:2.5rem;
    line-height:1.2;
    letter-spacing:0.5px;
    background:linear-gradient(180deg, var(--ivory) 20%, var(--gold-1) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:0.9rem;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:0 auto 1.4rem;
    width:120px;
  }
  .divider span{ height:1px; flex:1; background:linear-gradient(90deg, transparent, var(--gold-2), transparent); }
  .divider i{
    width:5px; height:5px;
    border-radius:1px;
    background:var(--gold-1);
    transform:rotate(45deg);
    flex-shrink:0;
  }

  .subtitle{
    color:var(--muted);
    font-weight:300;
    font-size:1rem;
    line-height:1.9;
    max-width:30ch;
    margin:0 auto 2.5rem;
  }

  .btn-contact{
    position:relative;
    display:inline-block;
    text-decoration:none;
    color:var(--ink);
    font-weight:700;
    font-size:1rem;
    letter-spacing:0.3px;
    padding:15px 44px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 100%);
    box-shadow:0 12px 30px rgba(185,138,52,0.28);
    transition:transform .35s cubic-bezier(.19,1,.22,1), box-shadow .35s ease;
  }
  .btn-contact:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 36px rgba(185,138,52,0.4);
  }
  .btn-contact:focus-visible{
    outline:2px solid var(--gold-1);
    outline-offset:3px;
  }

  @media (max-width:380px){
    .card{ padding:2.8rem 1.4rem 2.2rem; }
    h1{ font-size:2.1rem; }
  }
</style>
</head>
<body>

  <div class="dust" aria-hidden="true"></div>

  <div class="stage">
    <div class="frame-corner tl"></div>
    <div class="frame-corner br"></div>

    <div class="card">

      <div class="ring-wrap">
        <svg viewBox="0 0 148 148" class="ring-rotate" aria-hidden="true">
          <defs>
            <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ecd08a"/>
              <stop offset="100%" stop-color="#6e4c1e"/>
            </linearGradient>
          </defs>
          <circle cx="74" cy="74" r="72" fill="none" stroke="url(#ringGold)" stroke-width="1" stroke-dasharray="2 6" opacity="0.8"/>
          <g fill="#ecd08a" opacity="0.9">
            <circle cx="74" cy="2" r="2.4"/>
            <circle cx="74" cy="146" r="2.4"/>
            <circle cx="2" cy="74" r="2.4"/>
            <circle cx="146" cy="74" r="2.4"/>
          </g>
        </svg>
        <img src="IMG_20241120_004252_065.jpg" alt="HOMAM AJEENA" class="avatar-img">
      </div>

      <h1>HOMAM AJEENA</h1>

      <div class="divider"><span></span><i></i><span></span></div>

      <p class="subtitle">مرحباً بكم.. هذه المساحة الرسمية الخاصة بي للتواصل المباشر.</p>

      <a href="contact.html" class="btn-contact">Contact Me</a>

    </div>
  </div>

  <script>
    // ambient gold dust — generated once, cheap, respects reduced motion
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const field = document.querySelector('.dust');
      const count = 22;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('i');
        const left = Math.random() * 100;
        const delay = Math.random() * 12;
        const duration = 10 + Math.random() * 10;
        const drift = (Math.random() * 60 - 30) + 'px';
        p.style.left = left + 'vw';
        p.style.bottom = '-10px';
        p.style.setProperty('--drift', drift);
        p.style.animationDelay = delay + 's';
        p.style.animationDuration = duration + 's';
        field.appendChild(p);
      }
    }
  </script>

</body>
</html>
