<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMAM AJEENA</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        p {
            color: #6c757d;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .social-btn {
            text-decoration: none;
            color: #212529;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .social-btn:hover {
            background-color: #212529;
            color: #ffffff;
        }
        hr {
            border: none;
            border-top: 1px solid #e9ecef;
            margin: 1.5rem 0;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
            color: #495057;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            background-color: #212529;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #343a40;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HOMAM AJEENA</h1>
        <p>أهلاً بكم في المساحة الرسمية الخاصة بي للتواصل.</p>

        <!-- روابط منصات التواصل الاجتماعي (تجريبية) -->
        <div class="social-links">
            <a href="https://x.com/HOMAM_AJEENA" target="_blank" class="social-btn">X (تويتر)</a>
            <a href="https://instagram.com/HOMAM_AJEENA" target="_blank" class="social-btn">انستغرام</a>
            <a href="https://linkedin.com/in/HOMAM_AJEENA" target="_blank" class="social-btn">لينكد إن</a>
        </div>

        <hr>

        <!-- نموذج المراسلة المباشر -->
        <form action="https://formspree.io/f/sample" method="POST">
            <div class="form-group">
                <label>الاسم:</label>
                <input type="text" name="name" required placeholder="اكتب اسمك هنا">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني:</label>
                <input type="email" name="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>الرسالة:</label>
                <textarea name="message" required placeholder="اكتب رسالتك هنا..."></textarea>
            </div>
            <button type="submit">إرسال الرسالة</button>
        </form>
    </div>
</body>
</html>
